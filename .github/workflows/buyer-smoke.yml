# Validates the documented buyer path: install + Expo config + JS bundle.
# Catches Node/Metro/import breakages before packaging for CodeCanyon.
name: Buyer smoke

on:
  push:
    branches: [codecanyon-sources, main, master, dev-clean-1]
  pull_request:
  workflow_dispatch:

concurrency:
  group: buyer-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Install + Expo export
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Enforce Node engines
        run: |
          node -e "const m=+process.versions.node.split('.')[0]; if(m<20){console.error('Need Node >=20, got',process.version); process.exit(1)}"

      - name: Create .env from example
        run: cp .env.example .env

      - name: Install dependencies
        run: npm ci

      - name: Validate Expo config
        run: npx expo config --type public

      - name: Bundle Android JS (expo export)
        run: npx expo export --platform android --output-dir /tmp/good-food-customer-export

      - name: Bundle iOS JS (expo export)
        run: npx expo export --platform ios --output-dir /tmp/good-food-customer-export-ios

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Separate job: lint noise must not hide a broken install/bundle.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint
