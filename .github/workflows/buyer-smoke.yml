# Separated CI: build JS once → Hermes compile (fast). Live API smoke in parallel.
# No Android emulator / Maestro (those made every failure cost 30–60 minutes).
name: Buyer smoke

on:
  push:
    branches: [codecanyon-sources, main, master, dev-clean-1]
  pull_request:
  workflow_dispatch:

concurrency:
  group: buyer-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-js:
    name: Build JS bundles
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Env for export
        run: |
          cat > .env <<'EOF'
          EXPO_PUBLIC_API_URL=https://good-foods.digitaldienste.fr/api
          EXPO_PUBLIC_DEMO_MODE=true
          EXPO_PUBLIC_DEMO_EMAIL=demo@customer.com
          EXPO_PUBLIC_DEMO_PASSWORD=demo123
          EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY=
          EXPO_PUBLIC_MAPTILER_API_KEY=
          EOF
          sed -i 's/^[[:space:]]*//' .env
      - run: npm ci
      - name: Expo config
        run: npx expo config --type public >/dev/null
      - name: Export Android + iOS
        run: |
          mkdir -p dist-android dist-ios
          npx expo export --platform android --output-dir dist-android
          npx expo export --platform ios --output-dir dist-ios
      - name: Upload JS export artifacts
        uses: actions/upload-artifact@v4
        with:
          name: js-export
          path: |
            dist-android
            dist-ios
          retention-days: 3

  hermes-compile:
    name: Hermes compile (reuse export)
    needs: build-js
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Download JS export
        uses: actions/download-artifact@v4
        with:
          name: js-export
          path: .
      - name: Compile / validate with hermesc
        run: |
          chmod +x scripts/ci/hermes-compile-bundle.sh
          bash scripts/ci/hermes-compile-bundle.sh dist-android
          bash scripts/ci/hermes-compile-bundle.sh dist-ios

  api-live-smoke:
    name: Live API smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Demo login + restaurants
        run: |
          set -euo pipefail
          RESP=$(curl -sS -f -X POST 'https://good-foods.digitaldienste.fr/api/auth/customer-login' \
            -H 'Content-Type: application/json' \
            -d '{"email":"demo@customer.com","password":"demo123"}')
          TOKEN=$(node -e "const j=JSON.parse(process.argv[1]); if(!j.token) process.exit(1); process.stdout.write(j.token)" "$RESP")
          echo "login ok"
          COUNT=$(curl -sS -f 'https://good-foods.digitaldienste.fr/api/resource/restaurants' \
            -H "Authorization: Bearer $TOKEN" \
            | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{const j=JSON.parse(d); if(!Array.isArray(j)||j.length<1){console.error(d);process.exit(1)}; console.log(j.length)})")
          echo "restaurants ok ($COUNT)"

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint
