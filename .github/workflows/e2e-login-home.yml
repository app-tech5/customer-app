# CI = parcours acheteur (README), pas un APK debug recyclé.
# 1) .env + npm ci
# 2) npm start (Metro)
# 3) npm run android (expo run:android sur l’émulateur)
# 4) Maestro: Sign In (démo préremplie) → Home
name: E2E login→home

on:
  workflow_dispatch:
    inputs:
      debug_ssh_on_failure:
        description: "If Maestro fails, pause with tmate SSH (emulator stays up)"
        required: false
        type: boolean
        default: false

concurrency:
  group: e2e-login-home-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
  EXPO_PUBLIC_DEMO_MODE: ${{ vars.EXPO_PUBLIC_DEMO_MODE }}
  EXPO_PUBLIC_DEMO_EMAIL: ${{ vars.EXPO_PUBLIC_DEMO_EMAIL }}
  EXPO_PUBLIC_DEMO_PASSWORD: ${{ vars.EXPO_PUBLIC_DEMO_PASSWORD }}
  AVD_API: "30"
  AVD_ARCH: x86_64
  DEBUG_SSH_ON_FAILURE: ${{ inputs.debug_ssh_on_failure }}

permissions:
  contents: read

jobs:
  buyer-login-home:
    name: Buyer path login→home
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Require API URL var
        run: test -n "${{ vars.EXPO_PUBLIC_API_URL }}"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Buyer .env (same as README / .env.example)
        run: |
          cat > .env <<EOF
          EXPO_PUBLIC_API_URL=${{ vars.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_DEMO_MODE=${{ vars.EXPO_PUBLIC_DEMO_MODE }}
          EXPO_PUBLIC_DEMO_EMAIL=${{ vars.EXPO_PUBLIC_DEMO_EMAIL }}
          EXPO_PUBLIC_DEMO_PASSWORD=${{ vars.EXPO_PUBLIC_DEMO_PASSWORD }}
          EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY=
          EXPO_PUBLIC_MAPTILER_API_KEY=
          EOF
          sed -i 's/^[[:space:]]*//' .env
          cat .env

      - name: Buyer npm install
        run: npm ci

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-buyer-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'package-lock.json') }}

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.AVD_API }}-${{ env.AVD_ARCH }}-buyer-v1
          restore-keys: |
            avd-${{ env.AVD_API }}-${{ env.AVD_ARCH }}-

      - name: Buyer path — android + Metro + Maestro login→home
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.AVD_API }}
          arch: ${{ env.AVD_ARCH }}
          target: google_apis
          profile: pixel_6
          force-avd-creation: ${{ steps.avd-cache.outputs.cache-hit != 'true' }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash -euo pipefail scripts/ci/run-buyer-login-home.sh

      - name: Upload Maestro artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buyer-login-home
          path: |
            /tmp/maestro-login-home.xml
            /tmp/metro.log
            /tmp/expo-android.log
            ~/.maestro/tests
            ci-smoke-home*.png
          if-no-files-found: ignore
