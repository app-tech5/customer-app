# Maestro login→home. Reuses existing android-debug-apk — NEVER builds APK.
name: E2E login→home

on:
  workflow_dispatch:
    inputs:
      reuse_run_id:
        description: "Run id that uploaded android-debug-apk"
        required: true
        type: string

concurrency:
  group: e2e-login-home-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
  EXPO_PUBLIC_DEMO_MODE: ${{ vars.EXPO_PUBLIC_DEMO_MODE }}
  EXPO_PUBLIC_DEMO_EMAIL: ${{ vars.EXPO_PUBLIC_DEMO_EMAIL }}
  EXPO_PUBLIC_DEMO_PASSWORD: ${{ vars.EXPO_PUBLIC_DEMO_PASSWORD }}
  AVD_API: "30"
  AVD_ARCH: x86_64

jobs:
  login-home:
    name: Maestro login→home (reuse APK)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Require vars
        run: |
          test -n "${{ vars.EXPO_PUBLIC_API_URL }}"
          test -n "${{ inputs.reuse_run_id }}"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Download existing android-debug-apk (no rebuild)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p apk-out
          echo "REUSE ONLY — run ${{ inputs.reuse_run_id }}"
          gh run download "${{ inputs.reuse_run_id }}" -n android-debug-apk -D apk-out -R "${{ github.repository }}"
          find apk-out -type f -ls

      - name: Locate APK
        id: apk
        run: |
          APK=$(find apk-out -name '*.apk' | head -n 1)
          test -n "$APK"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Write .env for Metro
        run: |
          cat > .env <<EOF
          EXPO_PUBLIC_API_URL=${{ vars.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_DEMO_MODE=${{ vars.EXPO_PUBLIC_DEMO_MODE }}
          EXPO_PUBLIC_DEMO_EMAIL=${{ vars.EXPO_PUBLIC_DEMO_EMAIL }}
          EXPO_PUBLIC_DEMO_PASSWORD=${{ vars.EXPO_PUBLIC_DEMO_PASSWORD }}
          EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY=
          EXPO_PUBLIC_MAPTILER_API_KEY=
          EOF
          sed -i 's/^[[:space:]]*//' .env

      - run: npm ci

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.AVD_API }}-${{ env.AVD_ARCH }}-maestro-reuse-v1
          restore-keys: |
            avd-${{ env.AVD_API }}-${{ env.AVD_ARCH }}-

      - name: Maestro login→home
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.AVD_API }}
          arch: ${{ env.AVD_ARCH }}
          target: google_apis
          profile: pixel_6
          force-avd-creation: ${{ steps.avd-cache.outputs.cache-hit != 'true' }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash -euo pipefail scripts/ci/run-maestro-login-home.sh "${{ steps.apk.outputs.apk }}"

      - name: Upload Maestro artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-login-home
          path: |
            /tmp/maestro-login-home.xml
            /tmp/metro.log
            ~/.maestro/tests
            ci-smoke-home*.png
          if-no-files-found: ignore
