# Fast login→home: REUSE an existing x86 APK artifact — never rebuild by default.
# Pass reuse_run_id = Actions run that uploaded android-debug-apk (e.g. 31879265705).
name: E2E login→home

on:
  workflow_dispatch:
    inputs:
      reuse_run_id:
        description: "Run id that has artifact android-debug-apk (required unless force_rebuild)"
        required: false
        type: string
        default: ""
      force_rebuild_apk:
        description: "ONLY if you must rebuild (slow). Default false = reuse artifact."
        required: false
        type: boolean
        default: false

concurrency:
  group: e2e-login-home-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
  EXPO_PUBLIC_DEMO_MODE: ${{ vars.EXPO_PUBLIC_DEMO_MODE }}
  EXPO_PUBLIC_DEMO_EMAIL: ${{ vars.EXPO_PUBLIC_DEMO_EMAIL }}
  EXPO_PUBLIC_DEMO_PASSWORD: ${{ vars.EXPO_PUBLIC_DEMO_PASSWORD }}
  AVD_API: "30"
  AVD_ARCH: x86_64

jobs:
  login-home:
    name: KVM login→home (reuse APK)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Require API URL var
        run: |
          test -n "${{ vars.EXPO_PUBLIC_API_URL }}" || { echo "Missing vars.EXPO_PUBLIC_API_URL"; exit 1; }

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          egrep -c '(vmx|svm)' /proc/cpuinfo

      - name: Fail fast if no APK source
        if: ${{ inputs.force_rebuild_apk != true && inputs.reuse_run_id == '' }}
        run: |
          echo "Pass reuse_run_id (run that uploaded android-debug-apk). Do NOT rebuild unless forced."
          exit 1

      - name: Download existing android-debug-apk
        if: ${{ inputs.force_rebuild_apk != true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p apk-out
          echo "Reusing APK from run ${{ inputs.reuse_run_id }}"
          gh run download "${{ inputs.reuse_run_id }}" -n android-debug-apk -D apk-out -R "${{ github.repository }}"
          find apk-out -type f -ls

      - name: Locate APK
        id: apk
        run: |
          APK=$(find apk-out -name '*.apk' | head -n 1)
          test -n "$APK"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Write .env for Metro
        run: |
          cat > .env <<EOF
          EXPO_PUBLIC_API_URL=${{ vars.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_DEMO_MODE=${{ vars.EXPO_PUBLIC_DEMO_MODE }}
          EXPO_PUBLIC_DEMO_EMAIL=${{ vars.EXPO_PUBLIC_DEMO_EMAIL }}
          EXPO_PUBLIC_DEMO_PASSWORD=${{ vars.EXPO_PUBLIC_DEMO_PASSWORD }}
          EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY=
          EXPO_PUBLIC_MAPTILER_API_KEY=
          EOF
          sed -i 's/^[[:space:]]*//' .env

      - run: npm ci

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.AVD_API }}-${{ env.AVD_ARCH }}-login-home-v2

      - name: Warm AVD snapshot (cache miss only)
        if: ${{ steps.avd-cache.outputs.cache-hit != 'true' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.AVD_API }}
          arch: ${{ env.AVD_ARCH }}
          target: google_apis
          profile: pixel_6
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: echo "AVD warmed"

      - name: Hermes login→home (KVM, reused APK)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.AVD_API }}
          arch: ${{ env.AVD_ARCH }}
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash -euo pipefail scripts/ci/run-hermes-smoke-on-emulator.sh "${{ steps.apk.outputs.apk }}"

      - name: Upload Metro log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: metro-log
          path: /tmp/metro.log
          if-no-files-found: ignore
