name: Build and publish APK

on:
  push:
    branches: [dev-clean-1]
    paths-ignore:
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      skip_eas_build:
        description: Skip EAS build and publish an existing build only
        type: boolean
        default: false
      build_id:
        description: EAS build ID (optional when skip_eas_build is true — uses latest finished Android build if empty)
        type: string
        required: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      APK_FILENAME: ${{ vars.APK_FILENAME }}
      VPS_DOWNLOADS_DIR: ${{ vars.VPS_DOWNLOADS_DIR }}
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Lint
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_eas_build != true }}
        run: npm run lint

      - name: Build APK (EAS)
        id: eas_build
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_eas_build != true }}
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_DEMO_MODE: ${{ vars.EXPO_PUBLIC_DEMO_MODE }}
          EXPO_PUBLIC_DEMO_EMAIL: ${{ vars.EXPO_PUBLIC_DEMO_EMAIL }}
          EXPO_PUBLIC_DEMO_PASSWORD: ${{ vars.EXPO_PUBLIC_DEMO_PASSWORD }}
          EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_MAPTILER_API_KEY: ${{ secrets.EXPO_PUBLIC_MAPTILER_API_KEY }}
        run: |
          BUILD_ID=$(eas build -p android --profile release --non-interactive --wait --json | jq -r 'if type == "array" then .[-1].id else .id end')
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "EAS build id: $BUILD_ID"

      - name: Download APK from EAS
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.skip_eas_build }}" = "true" ]; then
            BUILD_ID="${{ inputs.build_id }}"
            if [ -z "$BUILD_ID" ] || [ "$BUILD_ID" = "null" ]; then
              echo "No build_id provided, using latest finished Android build..."
              BUILD_ID=$(eas build:list -p android --status finished --limit 1 --json --non-interactive | jq -r '.[0].id')
            fi
          else
            BUILD_ID="${{ steps.eas_build.outputs.build_id }}"
          fi

          if [ -z "$BUILD_ID" ] || [ "$BUILD_ID" = "null" ]; then
            echo "No EAS build found. Provide inputs.build_id or run a full build first."
            exit 1
          fi

          echo "Using EAS build id: $BUILD_ID"
          APK_URL=$(eas build:view "$BUILD_ID" --json --non-interactive | jq -r '.artifacts.buildUrl // .artifacts.applicationArchiveUrl')
          if [ -z "$APK_URL" ] || [ "$APK_URL" = "null" ]; then
            echo "No APK URL for build $BUILD_ID"
            exit 1
          fi
          curl -fsSL "$APK_URL" -o "$APK_FILENAME"
          ls -lh "$APK_FILENAME"

      - name: Prepare downloads directory on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: VPS_DOWNLOADS_DIR
          script: |
            mkdir -p "$VPS_DOWNLOADS_DIR"
            chmod 755 "$VPS_DOWNLOADS_DIR"

      - name: Upload APK to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: ${{ env.APK_FILENAME }}
          target: ${{ env.VPS_DOWNLOADS_DIR }}/
          overwrite: true

      - name: APK published
        run: |
          BASE="${PUBLIC_SITE_URL%/}"
          echo "APK available at ${BASE}/downloads/${APK_FILENAME}"
