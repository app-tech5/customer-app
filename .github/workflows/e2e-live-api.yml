# Runtime E2E on GitHub Actions against the LIVE Good Food Pro API.
# No local device required. Backend is not started here.
name: E2E live API

on:
  push:
    branches: [codecanyon-sources, main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-live-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-maestro:
    name: Android emulator + Maestro
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Live API env for Expo embed
        run: |
          cat > .env <<'EOF'
          EXPO_PUBLIC_API_URL=https://good-foods.digitaldienste.fr/api
          EXPO_PUBLIC_DEMO_MODE=true
          EXPO_PUBLIC_DEMO_EMAIL=demo@customer.com
          EXPO_PUBLIC_DEMO_PASSWORD=demo123
          EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY=
          EXPO_PUBLIC_MAPTILER_API_KEY=
          EOF
          # Strip leading spaces from heredoc
          sed -i 's/^[[:space:]]*//' .env
          cat .env

      - name: Verify live demo login
        run: |
          curl -sS -f -X POST 'https://good-foods.digitaldienste.fr/api/auth/customer-login' \
            -H 'Content-Type: application/json' \
            -d '{"email":"demo@customer.com","password":"demo123"}' \
            | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{const j=JSON.parse(d); if(!j.token){console.error(d); process.exit(1)}; console.log('live login ok')})"

      - name: Install JS dependencies
        run: npm ci

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Build x86_64 release APK for emulator
        run: |
          # Repo ships arm64-only ABI split; CI emulator needs x86_64.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          t = p.read_text()
          t2 = t.replace('include "arm64-v8a"', 'include "x86_64"')
          if t == t2:
              raise SystemExit("ABI split patch failed")
          p.write_text(t2)
          print("patched ABI split -> x86_64")
          PY
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Locate APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk -name '*.apk' | head -n 1)
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run Maestro on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install -r "${{ steps.apk.outputs.apk }}"
            adb shell settings put system system_locales en-US
            adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS || true
            maestro test .maestro/ci-smoke.yaml

      - name: Upload Maestro artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-ci-smoke
          path: |
            ~/.maestro/tests
            *.png
            ci-smoke-home*.png
          if-no-files-found: ignore
