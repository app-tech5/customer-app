name: CodeCanyon screenshots (Maestro)

# Independent screenshot CI:
# - does NOT build the app
# - downloads the already-published customer APK
# - runs Maestro on an arm64 emulator
# - uploads screenshot artifacts

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "Optional override. Empty = PUBLIC_SITE_URL/downloads/APK_FILENAME"
        required: false
        default: ""
      maestro_flow:
        description: "Maestro flow file under .maestro/"
        required: true
        default: "codecanyon-screenshots.yaml"

concurrency:
  group: codecanyon-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: macos-14
    timeout-minutes: 75

    steps:
      - name: Checkout Maestro flows
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .maestro
          sparse-checkout-cone-mode: false

      - name: Resolve published APK URL
        id: apk
        env:
          INPUT_APK_URL: ${{ inputs.apk_url }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          APK_FILENAME: ${{ vars.APK_FILENAME }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_APK_URL}" ]; then
            URL="$INPUT_APK_URL"
          else
            if [ -z "${PUBLIC_SITE_URL}" ] || [ -z "${APK_FILENAME}" ]; then
              echo "Missing vars.PUBLIC_SITE_URL or vars.APK_FILENAME (or pass apk_url input)."
              exit 1
            fi
            BASE="${PUBLIC_SITE_URL%/}"
            URL="${BASE}/downloads/${APK_FILENAME}"
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Using APK: $URL"

      - name: Download published APK
        run: |
          set -euo pipefail
          mkdir -p artifacts
          curl -fL --retry 3 --retry-delay 2 -o artifacts/customer.apk "${{ steps.apk.outputs.url }}"
          ls -lh artifacts/customer.apk

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Run Maestro screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: aarch64
          target: google_apis
          profile: pixel_6
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail
            adb wait-for-device
            adb shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 1; done'

            adb install -r artifacts/customer.apk
            adb shell monkey -p com.goodfoods.goodfoods -c android.intent.category.LAUNCHER 1 || true
            sleep 10

            FLOW=".maestro/${{ inputs.maestro_flow }}"
            test -f "$FLOW"

            maestro test "$FLOW" \
              --format junit \
              --output artifacts/maestro-report.xml

            if [ -d "$HOME/.maestro/tests" ]; then
              cp -R "$HOME/.maestro/tests" artifacts/maestro-tests
            fi

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codecanyon-customer-screenshots
          path: artifacts/
          if-no-files-found: warn
