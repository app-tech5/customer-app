name: Build and publish web demo

# Manual only for real publishes. A push of THIS file alone registers the workflow in Actions.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-web-demo.yml'

jobs:
  build-and-publish:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: Export web + publish demo
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
      EXPO_PUBLIC_DEMO_MODE: ${{ vars.EXPO_PUBLIC_DEMO_MODE }}
      EXPO_PUBLIC_DEMO_EMAIL: ${{ vars.EXPO_PUBLIC_DEMO_EMAIL }}
      EXPO_PUBLIC_DEMO_PASSWORD: ${{ vars.EXPO_PUBLIC_DEMO_PASSWORD }}
      EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_MAPTILER_API_KEY: ${{ secrets.EXPO_PUBLIC_MAPTILER_API_KEY }}
      WEB_DEMO_SLUG: customer
      VPS_WEB_DEMO_DIR: /var/www/html/demo/customer
      PUBLIC_DEMO_URL: https://good-foods.digitaldienste.fr/demo/customer/index.html
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Ensure web peer deps (CI only)
        run: npx expo install @lottiefiles/dotlottie-react

      - name: Set web baseUrl for /demo/customer
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'app.json';
          const app = JSON.parse(fs.readFileSync(path, 'utf8'));
          app.expo = app.expo || {};
          app.expo.web = { ...(app.expo.web || {}), bundler: 'metro', output: 'single' };
          app.expo.experiments = { ...(app.expo.experiments || {}), baseUrl: '/demo/customer' };
          fs.writeFileSync(path, `${JSON.stringify(app, null, 2)}\n`);
          console.log('baseUrl=/demo/customer');
          NODE

      - name: Export web build
        run: |
          npx expo export -p web --output-dir dist
          test -f dist/index.html
          ls -la dist | head -30

      - name: Prepare remote staging dir
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            mkdir -p /tmp/web-demo-customer
            rm -rf /tmp/web-demo-customer/*
            chmod 755 /tmp/web-demo-customer

      - name: Upload dist to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: dist/*
          target: /tmp/web-demo-customer/
          overwrite: true
          strip_components: 1

      - name: Publish to nginx demo path
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: VPS_WEB_DEMO_DIR
          script_stop: true
          script: |
            set -e
            SRC=/tmp/web-demo-customer
            WEB="$VPS_WEB_DEMO_DIR"
            test -f "$SRC/index.html"
            mkdir -p "$WEB"
            rsync -a --delete "$SRC/" "$WEB/"
            chmod -R a+rX "$WEB"
            test -f "$WEB/index.html"
            # Directory URL /demo/customer/ is swallowed by admin SPA; index.html is the public URL.
            grep -qi 'Admin Panel' "$WEB/index.html" && { echo 'Published admin SPA by mistake'; exit 1; } || true
            head -c 200 "$WEB/index.html"

      - name: Verify public URL
        run: |
          html="$(curl -fsSL "$PUBLIC_DEMO_URL")"
          echo "$html" | head -c 240
          echo
          echo "$html" | grep -qi 'Admin Panel' && { echo 'URL still serves admin'; exit 1; }
          echo "$html" | grep -qiE '_expo|react-native-web|Good Food' || { echo 'Unexpected demo HTML'; exit 1; }
          echo "OK $PUBLIC_DEMO_URL"
