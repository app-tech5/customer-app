appId: com.goodfoods.demo
name: Fix Search + Offers + Cart details
---
# Bottom Search tab via coordinates (avoid header Search button)
- tapOn:
    point: "30%,93%"
- waitForAnimationToEnd
- takeScreenshot: 08-search

# Cart + details
- tapOn: "Cart"
- waitForAnimationToEnd
- takeScreenshot: 09-cart
- tapOn: "View Details"
- waitForAnimationToEnd
- takeScreenshot: 09b-cart-details

# Back home then drawer
- tapOn: "Home"
- waitForAnimationToEnd
- tapOn:
    point: "6%,8%"
- waitForAnimationToEnd
- takeScreenshot: 12-drawer
- tapOn: "Offers"
- waitForAnimationToEnd
- takeScreenshot: 13-offers

# Drawer again for Wallet
- tapOn:
    point: "6%,8%"
- waitForAnimationToEnd
- tapOn: "Wallet"
- waitForAnimationToEnd
- takeScreenshot: 14-wallet
