appId: com.goodfoods.goodfoods
name: Continue cart popup + checkout + wallet features
---
# Still on restaurant menu from previous flow. Add item via + button coordinates.

# Tap circular + under first menu item (~center)
- tapOn:
    point: "50%,48%"
- waitForAnimationToEnd
- takeScreenshot: 06a-after-plus-tap

# If dish detail, scroll to add CTA and tap + FAB
- scroll
- waitForAnimationToEnd
- takeScreenshot: 06b-dish-detail
- tapOn:
    point: "50%,78%"
- waitForAnimationToEnd
- takeScreenshot: 06c-after-add

# View Cart floating bar
- tapOn:
    text: "View Cart"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 07-cart-popup

# Checkout from popup
- tapOn:
    text: "Checkout"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 08-checkout

- back
- waitForAnimationToEnd
- back
- waitForAnimationToEnd
- back
- waitForAnimationToEnd

# ========== SEARCH / OFFERS ==========
- tapOn: "Home"
- waitForAnimationToEnd
- tapOn:
