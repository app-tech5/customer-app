appId: com.goodfoods.goodfoods
name: RestaurantsMapScreen - UI checklist (Android)
tags:
  - ui
  - map
  - restaurants
  - android
---
# Preconditions:
# - Screen is already open and active
# - User is logged in
# - Test data contains restaurants with valid coordinates
# - Android device/emulator

# ===========================================================
# 1) Affichage initial
# Vérifier: carte visible, header visible, bouton retour visible,
# searchbar visible, liste horizontale visible par défaut
# ===========================================================
- assertVisible:
    id: "restaurants-map-screen"
- assertVisible:
    id: "restaurants-map-webview"
- assertVisible:
    id: "restaurants-map-header"
- assertVisible:
    id: "restaurants-map-back-button"
- assertVisible:
    id: "restaurants-map-search-input"
- assertVisible:
    id: "restaurants-map-search-submit"
- assertVisible:
    id: "restaurants-map-horizontal-list"

# ===========================================================
# 2) Bouton toggle (icône seule) -> ouverture bottom sheet
# ===========================================================
- tapOn:
    id: "restaurants-map-list-toggle-button"
- waitForAnimationToEnd
- assertVisible:
    id: "restaurants-map-bottom-sheet"
- assertVisible:
    id: "restaurants-map-bottom-sheet-handle"
- assertVisible:
    id: "restaurants-map-vertical-list"

# ===========================================================
# 3) Liste verticale (bottom sheet): scroll haut/bas
# ===========================================================
- swipe:
    id: "restaurants-map-vertical-list"
    direction: UP
    duration: 700
- swipe:
    id: "restaurants-map-vertical-list"
    direction: DOWN
    duration: 700

# ===========================================================
# 4) Marker -> carrousel
# ===========================================================
# Le même bouton toggle (icône seule) referme la feuille
- tapOn:
    id: "restaurants-map-list-toggle-button"
- waitForAnimationToEnd
- assertVisible:
    id: "restaurants-map-horizontal-list"

# ===========================================================
# 5) Carrousel -> carte (scroll horizontal)
# ===========================================================
- swipe:
    id: "restaurants-map-horizontal-list"
    direction: LEFT
    duration: 500
- waitForAnimationToEnd
- swipe:
    id: "restaurants-map-horizontal-list"
    direction: RIGHT
    duration: 500
- waitForAnimationToEnd

# ===========================================================
# 6) Bouton "ma position" (permission accordée)
# ===========================================================
- assertVisible:
    id: "restaurants-map-location-button"
- tapOn:
    id: "restaurants-map-location-button"
- waitForAnimationToEnd

# ===========================================================
# 7) Sélection restaurant -> détail
# ===========================================================
- tapOn:
    id: "restaurants-map-card-index-0"
- waitForAnimationToEnd
# Assert robuste sans texte en dur
- assertVisible:
    id: "restaurant-detail-screen"

# ===========================================================
# 8) Navigation retour
# Cliquer flèche back, vérifier retour sans freeze
# ===========================================================
- back
- waitForAnimationToEnd
- assertVisible:
    id: "restaurants-map-screen"

# ===========================================================
# 9) Recherche (SearchBar)
# ===========================================================
- tapOn:
    id: "restaurants-map-search-input"
- eraseText
- inputText: "pizza"
- tapOn:
    id: "restaurants-map-search-submit"
- waitForAnimationToEnd
# Vérification navigation/résultat robuste (sans texte)
- assertVisible:
    id: "search-results-screen"

# ===========================================================
# 10) Non-régression UX: interactions rapides
# ===========================================================
- back
- waitForAnimationToEnd
- assertVisible:
    id: "restaurants-map-screen"
- repeat:
    times: 3
    commands:
      - tapOn:
          id: "restaurants-map-webview"
          point: "52%,46%"
      - waitForAnimationToEnd
      - swipe:
          id: "restaurants-map-horizontal-list"
          direction: LEFT
          duration: 350
      - waitForAnimationToEnd

# ===========================================================
# 11) Cas "pas de données" (run séparé)
# Simuler restaurantData = []
# ===========================================================
# - assertVisible:
#     id: "restaurants-map-empty-state"
# - assertVisible:
#     id: "restaurants-map-loading-text"

# ===========================================================
# 12) Permission refusée (run séparé)
# Sur Android, lancer flow dédié après révocation permission localisation
# Vérifier: bouton absent ou pas de crash
# ===========================================================
# - assertNotVisible:
#     id: "restaurants-map-location-button"

# ===========================================================
# 13) Rotation/tailles d'écran
# ===========================================================
# - setOrientation: LANDSCAPE
# - assertVisible:
#     id: "restaurants-map-header"
# - assertVisible:
#     id: "restaurants-map-webview"
# - assertVisible:
#     id: "restaurants-map-horizontal-list"
# - setOrientation: PORTRAIT
