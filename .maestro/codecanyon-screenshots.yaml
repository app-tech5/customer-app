appId: com.goodfoods.goodfoods
name: CodeCanyon customer screenshots (pro)
---
- takeScreenshot: 01-home
- waitForAnimationToEnd

- tapOn: "Pickup"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "restaurants-map-screen"
    timeout: 20000
- takeScreenshot: 02-map-nearby

- tapOn:
    id: "restaurants-map-card-index-0"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "restaurant-detail-screen"
    timeout: 20000
- takeScreenshot: 03-restaurant-detail

- scroll
- waitForAnimationToEnd
- takeScreenshot: 04-restaurant-offers-reviews

- scroll
- waitForAnimationToEnd
- takeScreenshot: 05-restaurant-menu

- scroll
- waitForAnimationToEnd

- tapOn: "Home"
- waitForAnimationToEnd

- tapOn:
    point: "30%,93%"
- waitForAnimationToEnd
- takeScreenshot: 08-search

- tapOn: "Cart"
- waitForAnimationToEnd
- takeScreenshot: 09-cart

- tapOn: "Order History"
- waitForAnimationToEnd
- takeScreenshot: 10-orders

- tapOn: "My Account"
- waitForAnimationToEnd
- takeScreenshot: 11-account

- tapOn:
    text: "Open menu"
- waitForAnimationToEnd
- takeScreenshot: 12-drawer

- tapOn: "Offers & Discounts"
- waitForAnimationToEnd
- takeScreenshot: 13-offers

- tapOn:
    text: "Open menu"
- waitForAnimationToEnd
- tapOn: "Wallet"
- waitForAnimationToEnd
- takeScreenshot: 14-wallet
